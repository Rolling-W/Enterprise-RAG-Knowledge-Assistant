version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: erag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build: ./backend
    container_name: erag-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - APP_ENV=development
    depends_on:
      - qdrant

  frontend:
    build: ./frontend
    container_name: erag-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  qdrant_storage:
